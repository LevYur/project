global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "gateway"
    metrics_path: /api/gateway/metrics # указывает путь к /metrics внутри приложения
    static_configs:
      - targets: ["gateway-service:7970"]  # порт контейнера gateway
        labels:
          service: "gateway"

  - job_name: "auth"
    metrics_path: /api/auth/metrics
    static_configs:
      - targets: ["auth-service:7971"]  # порт контейнера auth
        labels:
          service: "auth"

  - job_name: "cart"
    metrics_path: /api/cart/metrics
    static_configs:
      - targets: [ "cart-service:7074" ]
        labels:
          service: "cart"