basePath: /api/auth
definitions:
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user_id:
        type: integer
    required:
    - access_token
    - refresh_token
    - user_id
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.RefreshResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user_id:
        type: integer
    required:
    - access_token
    - refresh_token
    type: object
  users.RegisterRequest:
    properties:
      birth_date:
        type: string
      email:
        type: string
      fathers_name:
        maxLength: 50
        type: string
      name:
        maxLength: 50
        type: string
      password:
        minLength: 8
        type: string
      phone:
        type: string
      surname:
        maxLength: 50
        type: string
    required:
    - email
    - name
    - password
    - phone
    type: object
  users.RegisterResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user_id:
        type: integer
    required:
    - access_token
    - refresh_token
    type: object
info:
  contact:
    email: lev.uy@mail.ru
    name: Lev U.
    url: https://github.com/LevYur/project.git
  description: Auth-service returns the JWT for authorization or after registration
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Auth API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password. Returns access and refresh
        tokens on success.
      parameters:
      - description: Login credentials
        in: body
        name: loginRequest
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: invalid request payload
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: invalid email or password
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: user not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - auth
  /refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid refresh token for a new pair of access and refresh
        tokens.
      parameters:
      - description: Refresh token payload
        in: body
        name: RefreshRequest
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.RefreshResponse'
        "400":
          description: invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: invalid or expired refresh token
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh tokens
      tags:
      - auth
  /register:
    post:
      consumes:
      - application/json
      description: Register a new user with email, password, and name.
      parameters:
      - description: Register credentials
        in: body
        name: registerRequest
        required: true
        schema:
          $ref: '#/definitions/users.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users.RegisterResponse'
        "400":
          description: invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: user already registered
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User register
      tags:
      - auth
swagger: "2.0"
